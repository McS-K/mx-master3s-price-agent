name: MX Master 3S Price Monitor Agent

on:
  schedule:
    # Запуск каждые 6 часов (по времени UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Эта строчка позволяет запускать агента вручную кнопкой на сайте

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Price Monitor Agent
      env:
        # Передаем наши секреты в переменные окружения скрипта
        TELEGRAM_BOT_TOKEN: ${{ secrets::TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets::TELEGRAM_CHAT_ID }}
      run: python agent.py
